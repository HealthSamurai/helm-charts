replicaCount: 1

image:
  repository: healthsamurai/mdmbox
  # -- Check the registry when a pod starts so monthly tags pick up their latest minor.
  pullPolicy: Always
  # -- Overrides appVersion. Use YYMM for a monthly release or YYMM.N for an exact release.
  tag: ""
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels: {}

podSecurityContext: {}

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: mdmbox.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: mdmbox-tls
  #    hosts:
  #      - mdmbox.local

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  # limits:
  #   cpu: 2
  #   memory: 2Gi

livenessProbe:
  httpGet:
    path: /healthz
    port: main
  periodSeconds: 10
  failureThreshold: 10
readinessProbe:
  httpGet:
    path: /readyz
    port: main
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 5
startupProbe:
  httpGet:
    path: /readyz
    port: main
  initialDelaySeconds: 20
  periodSeconds: 5
  # 90 * 5s = 7.5 min — allows libox bootstrap (FHIR packages download/parse) on cold start
  failureThreshold: 90

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# -- Name of an existing ConfigMap with BOX_DB_* env vars
# (e.g. BOX_DB_HOST, BOX_DB_PORT, BOX_DB_DATABASE). Optional —
# convenience hook for the shared-Aidbox scenario where you already
# have an Aidbox ConfigMap. For standalone deployments leave empty
# and supply BOX_DB_* via .Values.config and/or extraEnvFromSecrets.
aidboxConfigMap: ""

# -- Name of an existing Secret with BOX_DB_USER, BOX_DB_PASSWORD.
# Optional — same shared-Aidbox convenience as aidboxConfigMap.
# For standalone, use extraEnvFromSecrets to mount your own Secret.
aidboxSecret: ""

# -- Names of additional ConfigMaps loaded via envFrom after config and the
# Aidbox sources. Later sources override earlier sources with the same key.
extraEnvFromConfigMaps: []

# -- Names of additional Secrets loaded last via envFrom, in list order.
# Use for MDMBOX_LICENSE, MDMBOX_ADMIN_PASSWORD, MDMBOX_API_CLIENT_SECRET,
# and database credentials when not supplied by aidboxSecret.
extraEnvFromSecrets: []

# -- Deployment update strategy.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# -- Time in seconds allowed for workers and other application components to stop before forced termination.
terminationGracePeriodSeconds: 60

# -- Non-secret MDMbox environment variables rendered into the chart's ConfigMap
# (for example JAVA_OPTS, MDMBOX_LOG_LEVEL, MDMBOX_DB_* and MDMBOX_BULK_DB_*).
# Non-secret BOX_DB_* values can also be supplied here for standalone deployments.
# Use extraEnvFromSecrets for the license and credentials. Aidbox and extra
# envFrom sources override duplicate keys from this ConfigMap.
# MDMBOX_HTTP_PORT is set explicitly from service.port and overrides envFrom.
config:
  JAVA_OPTS: "-XX:MaxRAMPercentage=75"

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true
