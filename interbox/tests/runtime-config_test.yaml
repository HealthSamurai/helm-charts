suite: runtime ConfigMap inputs
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/secret.yaml
tests:
  - it: mounts the main ConfigMap and supplies its internal path
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0]
          value:
            name: INTERBOX_RUNTIME_CONFIG_MAPS
            value: '["/run/interbox-runtime-config/0"]'
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: interbox-config
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value:
            name: interbox-runtime-config-0
            mountPath: /run/interbox-runtime-config/0
            readOnly: true
  - it: keeps every external ConfigMap in envFrom order without reading cluster state
    set:
      extraEnvFromConfigMaps: [external-first, external-second]
      extraEnvFromSecrets: [external-secret]
      volumeMounts: [{name: custom-data, mountPath: /data}]
      volumes: [{name: custom-data, emptyDir: {}}]
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: '["/run/interbox-runtime-config/0","/run/interbox-runtime-config/1","/run/interbox-runtime-config/2"]'
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef: {name: interbox-config}
            - secretRef: {name: interbox-secrets}
            - configMapRef: {name: external-first}
            - configMapRef: {name: external-second}
            - secretRef: {name: external-secret}
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: interbox-runtime-config-0
              configMap: {name: interbox-config}
            - name: interbox-runtime-config-1
              configMap: {name: external-first}
            - name: interbox-runtime-config-2
              configMap: {name: external-second}
            - name: custom-data
              emptyDir: {}
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2]
          value:
            name: interbox-runtime-config-2
            mountPath: /run/interbox-runtime-config/2
            readOnly: true
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[3]
          value: {name: custom-data, mountPath: /data}
  - it: does not project existing or additional Secrets into runtime configuration
    set:
      secrets.existingSecretName: external-credentials
      extraEnvFromSecrets: [more-credentials]
    template: templates/deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      - equal:
          path: spec.template.spec.containers[0].envFrom[1]
          value: {secretRef: {name: external-credentials}}
      - equal:
          path: spec.template.spec.containers[0].envFrom[2]
          value: {secretRef: {name: more-credentials}}
