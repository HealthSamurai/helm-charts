# AKS overlay: helm install interbox healthsamurai/interbox -f values-aks.yaml -f my-values.yaml
mllp:
  service:
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      # MLLP feeds idle between messages; minutes, max 30.
      service.beta.kubernetes.io/azure-load-balancer-tcp-idle-timeout: "30"
