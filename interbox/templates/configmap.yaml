apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "interbox.fullname" . }}-config
  labels:
    {{- include "interbox.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if not .Values.database.createDatabase }}
  # Locked-down PG: db is pre-created; skip the engine's boot-time bootstrap.
  INTERBOX_SKIP_ENSURE_DB: "1"
  {{- end }}
