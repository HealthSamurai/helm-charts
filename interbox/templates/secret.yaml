{{- if not .Values.secrets.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "interbox.fullname" . }}-secrets
  labels:
    {{- include "interbox.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := merge (omit .Values.secrets "existingSecretName" "data") (.Values.secrets.data | default dict) }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
