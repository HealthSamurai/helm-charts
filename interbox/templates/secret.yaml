{{- if not .Values.secrets.existingSecretName }}
# DATABASE_URL is required. Not hard-failed here so the chart renders on defaults;
# the app's boot-time migrate fails fast + clearly if it's missing. Its user needs
# CREATEDB (the engine self-creates the db on boot). See PREREQUISITES.md.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "interbox.fullname" . }}-secrets
  labels:
    {{- include "interbox.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
