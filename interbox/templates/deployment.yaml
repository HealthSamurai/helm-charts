apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "interbox.fullname" . }}
  labels:
    {{- include "interbox.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "interbox.selectorLabels" . | nindent 6 }}
  {{- with .Values.strategy }}
  strategy:
    {{- /* Values that set `type: Recreate` merge with the default `rollingUpdate`, which Kubernetes rejects for Recreate. */}}
    {{- toYaml (eq (toString .type) "Recreate" | ternary (omit . "rollingUpdate") .) | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "interbox.selectorLabels" . | nindent 8 }}
      annotations:
        {{- /* Payload only: labels carry the chart version, so hashing them restarts pods on every chart bump. */}}
        checksum/config: {{ (include (print $.Template.BasePath "/configmap.yaml") . | fromYaml).data | toJson | sha256sum }}
        {{- if not .Values.secrets.existingSecretName }}
        checksum/secret: {{ (include (print $.Template.BasePath "/secret.yaml") . | fromYaml).stringData | toJson | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "interbox.serviceAccountName" . }}
      serviceAccountName: {{ include "interbox.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "interbox.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ include "interbox.apiPort" . }}
              protocol: TCP
            {{- if .Values.mllp.enabled }}
            - name: mllp
              containerPort: {{ .Values.mllp.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: {{ include "interbox.webhookPort" . }}
              protocol: TCP
            {{- end }}
          env:
            {{- /* Set even with webhook.enabled off: a Service named <release>-webhook makes Kubernetes inject INTERBOX_WEBHOOK_PORT=tcp://<ip>:<port> into every pod of the namespace, and the engine refuses that value. env also beats envFrom. */}}
            - name: INTERBOX_WEBHOOK_PORT
              value: {{ include "interbox.webhookPort" . | quote }}
            - name: INTERBOX_WORKSPACE_SERVICE_URL
              value: {{ include "interbox.workspaceServiceUrl" . }}
          envFrom:
            - configMapRef:
                name: {{ include "interbox.fullname" . }}-config
            - secretRef:
                name: {{ include "interbox.secretName" . }}
            {{- range .Values.extraEnvFromConfigMaps }}
            - configMapRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- $probe := .Values.probe }}
          {{- with $probe.startup }}
          startupProbe:
            httpGet:
              path: {{ .path | default $probe.path }}
              port: http
              scheme: {{ $probe.scheme | default "HTTP" }}
            {{- omit . "path" | toYaml | nindent 12 }}
          {{- end }}
          {{- with $probe.liveness }}
          livenessProbe:
            httpGet:
              path: {{ .path | default $probe.path }}
              port: http
              scheme: {{ $probe.scheme | default "HTTP" }}
            {{- omit . "path" | toYaml | nindent 12 }}
          {{- end }}
          {{- with $probe.readiness }}
          readinessProbe:
            httpGet:
              path: {{ .path | default $probe.path }}
              port: http
              scheme: {{ $probe.scheme | default "HTTP" }}
            {{- omit . "path" | toYaml | nindent 12 }}
          {{- end }}
          {{- if gt (int .Values.preStopDelaySeconds) 0 }}
          {{- /* Kubernetes takes an unset grace period as 30. `default` would also turn an explicit 0 into 30. */}}
          {{- $grace := .Values.terminationGracePeriodSeconds }}
          {{- if kindIs "invalid" $grace }}{{- $grace = 30 }}{{- end }}
          {{- if ge (int .Values.preStopDelaySeconds) (int $grace) }}
          {{- fail (printf "preStopDelaySeconds %d must be below terminationGracePeriodSeconds %d: the delay counts toward it, and the engine would be killed mid-shutdown" (int .Values.preStopDelaySeconds) (int $grace)) }}
          {{- end }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ int .Values.preStopDelaySeconds }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
