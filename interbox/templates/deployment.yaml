apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "interbox.fullname" . }}
  labels:
    {{- include "interbox.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "interbox.selectorLabels" . | nindent 6 }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "interbox.selectorLabels" . | nindent 8 }}
      annotations:
        {{- /* Payload only: labels carry the chart version, so hashing them restarts pods on every chart bump. */}}
        checksum/config: {{ (include (print $.Template.BasePath "/configmap.yaml") . | fromYaml).data | toJson | sha256sum }}
        {{- if not .Values.secrets.existingSecretName }}
        checksum/secret: {{ (include (print $.Template.BasePath "/secret.yaml") . | fromYaml).stringData | toJson | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "interbox.serviceAccountName" . }}
      serviceAccountName: {{ include "interbox.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "interbox.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.mllp.enabled }}
            - name: mllp
              containerPort: {{ .Values.mllp.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: INTERBOX_RUNTIME_CONFIG_DIR
              value: /run/interbox-runtime-config
            - name: INTERBOX_WORKSPACE_INSTANCE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          envFrom:
            - configMapRef:
                name: {{ include "interbox.fullname" . }}-config
            - secretRef:
                name: {{ include "interbox.secretName" . }}
            {{- range .Values.extraEnvFromConfigMaps }}
            - configMapRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- $probe := .Values.probe }}
          {{- with $probe.startup }}
          startupProbe:
            httpGet:
              path: {{ .path | default $probe.path }}
              port: http
              scheme: {{ $probe.scheme | default "HTTP" }}
            {{- omit . "path" | toYaml | nindent 12 }}
          {{- end }}
          {{- with $probe.liveness }}
          livenessProbe:
            httpGet:
              path: {{ .path | default $probe.path }}
              port: http
              scheme: {{ $probe.scheme | default "HTTP" }}
            {{- omit . "path" | toYaml | nindent 12 }}
          {{- end }}
          {{- with $probe.readiness }}
          readinessProbe:
            httpGet:
              path: {{ .path | default $probe.path }}
              port: http
              scheme: {{ $probe.scheme | default "HTTP" }}
            {{- omit . "path" | toYaml | nindent 12 }}
          {{- end }}
          {{- if gt (int .Values.preStopDelaySeconds) 0 }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ .Values.preStopDelaySeconds | quote }}]
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: interbox-runtime-config
              mountPath: /run/interbox-runtime-config
              readOnly: true
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: interbox-runtime-config
          projected:
            sources:
              - configMap:
                  name: {{ include "interbox.fullname" . }}-config
              {{- range .Values.extraEnvFromConfigMaps }}
              - configMap:
                  name: {{ . }}
              {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      restartPolicy: Always
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
