# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource name (default: the chart name).
fullnameOverride: ""

# -- Pod replicas. Every ready replica gets traffic, and a lease in Postgres picks the one that processes (interbox 2.4.0 and later support multiple replicas). Add replicas for availability, not throughput.
replicaCount: 1

image:
  # -- Image repository.
  repository: healthsamurai/interbox
  # -- Image tag (default: `.Chart.AppVersion`). Pin a release for prod.
  tag: ""
  # -- Image digest; wins over `tag`.
  digest: ""
  # -- Image pull policy. `Always` refreshes the moving `edge` tag; use `IfNotPresent` once pinned.
  pullPolicy: Always

# -- Image pull secrets for a private registry.
imagePullSecrets: []

probe:
  # -- Default HTTP path for every probe. A probe's own `path` wins.
  path: /api/health
  # -- Probe scheme (HTTP / HTTPS).
  scheme: HTTP
  # -- Startup probe, for the main pods and the workspace service. Generous: the workspace service clones, installs and builds the workspace on its first start.
  startup:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 60
  # -- Liveness probe.
  liveness:
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  # -- Readiness probe. It inherits `probe.path`. On interbox 2.5.0 or later set `path: /api/ready`, so only ready pods with bound listeners get traffic; older engines must keep `/api/health`. See the README.
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# -- Deployment strategy. The default starts a new pod and waits for it to be ready before it stops an old one. `type: Recreate` drops `rollingUpdate` and stops every old pod first.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
# -- Grace period for in-flight messages to persist and ACK before SIGKILL.
terminationGracePeriodSeconds: 30

# -- Seconds the kubelet waits in `preStop` (the built-in `sleep` action, Kubernetes 1.30+), so Service routing drains before shutdown. Counts toward `terminationGracePeriodSeconds` and must stay below it; `0` turns it off.
preStopDelaySeconds: 5

# -- Resources of each main pod. The main pods load published builds; `workspaceService.resources` covers the workspace build. `ephemeral-storage` covers the unpacked builds, the container filesystem and the logs: the request keeps the pod off a node with less free disk. Add `limits.ephemeral-storage` for a cap; Kubernetes evicts a pod that outgrows it, and rejects the pod when the limit is below the request, so lower `requests.ephemeral-storage` with it. Your keys merge with these; set one to `null` to drop it.
resources:
  requests:
    ephemeral-storage: 1Gi

verticalPodAutoscaler:
  enabled: false
  controlledResources: []
  controlledValues: ""
  maxAllowed: {}
  minAllowed: {}
  updatePolicy:
    updateMode: Initial
    # -- Lets the updater act on the single pod; by default it skips workloads with fewer than 2 replicas. `null` keeps that default.
    minReplicas: 1

# -- Node selector for scheduling.
nodeSelector: {}
# -- Affinity rules for scheduling.
affinity: {}
# -- Tolerations for scheduling.
tolerations: []
# -- Pod priority class, so the scheduler doesn't preempt the single pod for less important work.
priorityClassName: ""

# -- Don't mount the ServiceAccount token; interbox never calls the Kubernetes API.
automountServiceAccountToken: false

workspaceService:
  # -- Resources of the workspace service pod, which runs `bun install` and the workspace build. Your keys merge with these; set one to `null` to drop it.
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
      ephemeral-storage: 1Gi
  persistence:
    # -- Keep the workspace service's workspace checkout on a ReadWriteOnce PersistentVolumeClaim, so uncommitted edits survive restarts. `false` uses an `emptyDir` that goes away with the pod.
    enabled: true
    # -- PVC size.
    size: 5Gi
    # -- PVC `storageClassName`. Empty = the cluster default.
    storageClass: ""

# -- Container securityContext. The image runs as non-root `bun` (uid 1000) and writes to HOME and `/tmp`.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# -- Pod annotations.
podAnnotations: {}
# -- Deployment annotations.
deploymentAnnotations: {}
# -- Extra pod volumes.
volumes: []
# -- Extra container volume mounts.
volumeMounts: []

serviceAccount:
  # -- Create a ServiceAccount for the pod.
  create: false
  # -- ServiceAccount name (default: the fullname when `create` is true).
  name: ""
  # -- ServiceAccount annotations.
  annotations: {}

# -- Non-secret env → ConfigMap (envFrom). Keys are env var names; `DATABASE_URL` and `INTERBOX_WEBHOOK_PORT` fail the render. `INTERBOX_WORKSPACE_GIT_URL` and
# `INTERBOX_PUBLIC_URL` are required. `MLLP_HOST` and `MLLP_PORT` feed the workspace's MLLP source.
config:
  INTERBOX_WORKSPACE_POLL_MS: "5000"

  MLLP_HOST: "0.0.0.0"
  MLLP_PORT: "2575"

  AIDBOX_URL: "http://aidbox:8080"

# -- Secret env → Secret (envFrom). Keys are env var names; empty ones are skipped. `DATABASE_URL`
# is required. The dashboard also needs `INTERBOX_AUTH_ADMIN_PASSWORD` unless
# `INTERBOX_AUTH_ADMIN_ENABLED` is `false` (OIDC only; see PREREQUISITES.md).
# `secrets.data.<KEY>` is deprecated; a flat key wins.
secrets:
  # -- Pre-provisioned Secret to use instead of rendering one (External Secrets Operator, sealed-secrets, …).
  existingSecretName: ""

  DATABASE_URL: ""
  INTERBOX_DB_DATABRICKS_CLIENT_SECRET: ""

  INTERBOX_AUTH_ADMIN_PASSWORD: ""
  INTERBOX_AUTH_CLIENT_SECRET: ""

  INTERBOX_WORKSPACE_GIT_KEY: ""
  INTERBOX_LICENSE: ""

  AIDBOX_CLIENT_SECRET: ""

  CLAUDE_CODE_OAUTH_TOKEN: ""
  ANTHROPIC_API_KEY: ""

# -- Extra ConfigMaps to load env from (envFrom).
extraEnvFromConfigMaps: []
# -- Extra Secrets to load env from (envFrom).
extraEnvFromSecrets: []

database:
  # -- The engine creates the `interbox` db on boot (`DATABASE_URL` user needs `CREATEDB`). `false` sets `INTERBOX_SKIP_ENSURE_DB`: pre-create the db yourself.
  createDatabase: true

# -- Port the API and dashboard listen on, in the main pods and the workspace service. The chart sets `API_PORT` from it.
apiPort: 3001

service:
  # -- Dashboard/API Service type.
  type: ClusterIP
  # -- Port of the dashboard/API Service. It forwards to `apiPort`.
  port: 3001
  # -- Dashboard/API Service annotations.
  annotations: {}

mllp:
  # -- Expose MLLP (HL7v2 over raw TCP).
  enabled: true
  # -- MLLP TCP port. Match the port the workspace's MLLP source listens on.
  port: 2575
  service:
    # -- MLLP Service type. Raw TCP, so not an Ingress.
    type: LoadBalancer
    # -- MLLP Service annotations. Without the cloud's internal-LB annotation (see values-aks.yaml), most clouds give the LoadBalancer a public IP.
    annotations: {}
    # -- `Local` keeps the sender's source IP. Empty = `Cluster`.
    externalTrafficPolicy: Local
    # -- Static LB IP, a stable VPN/firewall target. Empty = dynamic. Kubernetes deprecated the field; prefer a cloud annotation.
    loadBalancerIP: ""
    # -- Sender CIDRs allowed to reach the LB.
    loadBalancerSourceRanges: []

webhook:
  # -- Expose the webhook port: a container port, `INTERBOX_WEBHOOK_PORT`, and the `interbox-webhook` Service, always ClusterIP whatever `service.type` is. One port serves every `webhookSource` and every `pullSender`; the engine routes each request to its pipeline by `path`. Turn it on when the workspace declares either: while it is off, the engine still listens on `webhook.port` for them, but no Service carries the port.
  enabled: false
  # -- Webhook port. The chart always sets `INTERBOX_WEBHOOK_PORT` on the container from it, whether `enabled` is on or off. Set the port here only: `config.INTERBOX_WEBHOOK_PORT` fails the render, a different value in an extra ConfigMap rejects startup, and one in a Secret is ignored.
  port: 3002

ingress:
  # -- Dashboard/API Ingress. Use an internal ingress class only; never expose it publicly.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress host.
  host: interbox.example.com
  # -- Ingress path. AWS ALB and GKE gce want `/*` with `pathType: ImplementationSpecific`.
  path: /
  # -- Ingress pathType (Prefix | ImplementationSpecific | Exact).
  pathType: Prefix
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress TLS blocks.
  tls: []

route:
  main:
    # -- Render a Gateway API HTTPRoute to the dashboard/API Service. Each key under `route` is one route; `main` takes the release's full name, others add `-<key>`. Needs the Gateway API CRDs and a Gateway.
    enabled: false
    # -- Gateways the route attaches to. Required when `enabled`.
    parentRefs: []
    # -- Hostnames the route matches. Templated.
    hostnames: []
    # -- Route annotations. Templated.
    annotations: {}
    # -- Extra route labels.
    labels: {}
    # -- Request matches of the rule that sends traffic to the Service.
    matches:
      - path:
          type: PathPrefix
          value: /
    # -- Filters of the rule that sends traffic to the Service.
    filters: []
    # -- Timeouts of the rule that sends traffic to the Service, e.g. `request: 10s`.
    timeouts: {}
    # -- Rules rendered ahead of the rule to the Service. Templated.
    additionalRules: []
    # -- Replace the rule to the Service with a 301 redirect to HTTPS, for a route on an HTTP listener.
    httpsRedirect: false

networkPolicy:
  # -- Render an ingress-only NetworkPolicy for the pod. Egress stays open.
  enabled: false
  # -- NetworkPolicyPeers allowed to reach the dashboard/API port. Empty = none; `kubectl port-forward` still works.
  dashboardFrom: []
  # -- NetworkPolicyPeers allowed to reach the MLLP port. Empty = any source.
  mllpFrom: []
  # -- NetworkPolicyPeers allowed to reach the webhook port, e.g. the Aidbox pods. Empty = any source.
  webhookFrom: []
