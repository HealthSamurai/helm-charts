# interbox — Integration Engine for Modern Healthcare Solutions.
#
# Standalone chart: deploys the all-in-one interbox (engine + API + dashboard).
# Aidbox and Postgres are NOT bundled. Point interbox at them via config/secrets.
# Need them in-cluster? Install the sibling `aidbox` / `postgres` charts separately
# (see PREREQUISITES.md) and set config.AIDBOX_URL / secrets.data.DATABASE_URL.

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource name (default: the chart name — keeps the in-cluster service name stable).
fullnameOverride: ""

# -- Pod replicas. HA is deferred — leave at 1 (all-in-one process + single MLLP listener).
replicaCount: 1

image:
  # -- Image repository.
  repository: healthsamurai/interbox
  # -- Image tag; defaults to `.Chart.AppVersion` (`edge` pre-GA). Pin a semver for reproducible prod.
  tag: ""
  # -- Pin by digest (wins over tag when set).
  digest: ""
  # -- Image pull policy. `Always` refreshes the moving `edge` tag; set `IfNotPresent` once pinned.
  pullPolicy: Always

# -- Image pull secrets for a private registry.
imagePullSecrets: []

probe:
  # -- HTTP health path for all probes.
  path: /api/health
  # -- Probe scheme (HTTP / HTTPS).
  scheme: HTTP
  # -- Startup probe. Generous: the pod clones + installs + builds the workspace on boot.
  startup:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 60
  # -- Liveness probe.
  liveness:
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  # -- Readiness probe.
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# -- Deployment strategy. Recreate — one MLLP listener + boot-build, never two pods racing the TCP port.
strategy:
  type: Recreate
# -- Grace period for in-flight messages to persist + ACK before SIGKILL.
terminationGracePeriodSeconds: 30

# -- Pod resource requests / limits. NOTE: the boot-time workspace build (git clone +
# bun install + Bun.build) is memory-hungry — set limits generously, or omit the memory
# limit, to avoid an OOM kill during boot. e.g. requests: {cpu: 100m, memory: 512Mi}.
resources: {}

# -- Node selector for scheduling.
nodeSelector: {}
# -- Affinity rules for scheduling.
affinity: {}
# -- Tolerations for scheduling.
tolerations: []
# -- Don't mount the ServiceAccount token — interbox never calls the Kubernetes API.
automountServiceAccountToken: false

# -- Container securityContext. The image runs as non-root `bun` (uid 1000); writable
# paths are HOME + /tmp, /app is read-only. Hardened for prod. (readOnlyRootFilesystem
# is off — /tmp + HOME need writes; enable it only with emptyDir mounts at those paths.)
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
# -- Extra pod annotations.
podAnnotations: {}

serviceAccount:
  # -- Create a ServiceAccount for the pod.
  create: false
  # -- ServiceAccount name (generated from the fullname if empty and create=true).
  name: ""
  # -- ServiceAccount annotations.
  annotations: {}

# -- Non-secret env → ConfigMap (envFrom). Keys ARE env var names. `AIDBOX_URL` points at
# your Aidbox (the sibling `aidbox` chart in-cluster, or an existing external one). Uncomment
# `AIDBOX_CLIENT_ID` to authenticate as a scoped least-privilege client (defaults to `root`).
config:
  MLLP_HOST: "0.0.0.0"
  MLLP_PORT: "2575"
  AIDBOX_URL: "http://aidbox:8080"
  # AIDBOX_CLIENT_ID: "root"
  INTERBOX_WORKSPACE_POLL_MS: "5000"
  # INTERBOX_WORKSPACE_GIT_URL: "https://github.com/you/your-workspace"

secrets:
  # -- Use a pre-provisioned Secret instead of creating one from `data` below (External Secrets Operator, sealed-secrets, …).
  existingSecretName: ""
  # -- Secret env → Secret (envFrom). Keys ARE env var names; only non-empty ones are written.
  # `DATABASE_URL` is required — its user needs `CREATEDB` (the engine self-creates the db);
  # add `?sslmode=require` for TLS. `AIDBOX_CLIENT_SECRET` if using Aidbox. The rest are optional.
  data:
    DATABASE_URL: ""
    AIDBOX_CLIENT_SECRET: ""
    INTERBOX_LICENSE: ""
    CLAUDE_CODE_OAUTH_TOKEN: ""
    ANTHROPIC_API_KEY: ""
    INTERBOX_WORKSPACE_GIT_KEY: ""

# -- Extra ConfigMaps to load env from (envFrom) — extend the pod's env without editing the chart.
extraEnvFromConfigMaps: []
# -- Extra Secrets to load env from (envFrom).
extraEnvFromSecrets: []

database:
  # -- Engine self-creates the `interbox` db on boot when the DATABASE_URL user has `CREATEDB`.
  # `false` → sets `INTERBOX_SKIP_ENSURE_DB`; pre-create the db yourself (locked-down managed PG).
  createDatabase: true

service:
  # -- Dashboard/API service type.
  type: ClusterIP
  # -- Dashboard/API port.
  port: 3001

# interbox is an INTERNAL tool — nothing faces the public internet. MLLP is fed over
# VPN/VNet (transport-encrypted); the dashboard is cluster-internal.
mllp:
  # -- Expose MLLP (HL7v2 raw-TCP ingest).
  enabled: true
  # -- MLLP TCP port.
  port: 2575
  service:
    # -- MLLP service type. Raw TCP → LoadBalancer (HTTP ingress can't carry it).
    type: LoadBalancer
    # -- Request a private LB (senders reach it over VPN/VNet). Cloud annotation supplied via overlay.
    internal: true
    # -- Extra Service annotations (e.g. AKS internal-LB + tcp-idle-timeout — see values-aks.yaml).
    annotations: {}
    # -- Preserve the sender's source IP + skip the extra node hop (single-replica-safe). "" = Cluster.
    externalTrafficPolicy: Local
    # -- Pin the LB IP so it survives reinstall (stable VPN/firewall target). Must be a free subnet IP; empty = dynamic.
    loadBalancerIP: ""
    # -- Restrict the LB to known sender subnets even inside the private network (defense-in-depth).
    loadBalancerSourceRanges: []

ingress:
  # -- Ingress for the dashboard/API. Enable ONLY with an internal ingress class — never public.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress host.
  host: interbox.example.com
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress TLS blocks.
  tls: []
