# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource name (default: the chart name).
fullnameOverride: ""

# -- Pod replicas. Defaults to 1; coordinated engine versions support multiple replicas.
replicaCount: 1

image:
  # -- Image repository.
  repository: healthsamurai/interbox
  # -- Image tag (default: `.Chart.AppVersion`). Pin a release for prod.
  tag: ""
  # -- Image digest; wins over `tag`.
  digest: ""
  # -- Image pull policy. `Always` refreshes the moving `edge` tag; use `IfNotPresent` once pinned.
  pullPolicy: Always

# -- Image pull secrets for a private registry.
imagePullSecrets: []

probe:
  path: /api/health
  # -- Probe scheme (HTTP / HTTPS).
  scheme: HTTP
  # -- Startup probe. Generous: the pod clones, installs and builds the workspace on boot.
  startup:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 60
  # -- Liveness probe.
  liveness:
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  # -- Readiness probe.
  readiness:
    path: /api/ready
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# -- Deployment strategy. Use `Recreate` for the first upgrade from uncoordinated versions: stop all old engine and API pods before starting coordinated replicas. Later coordinated upgrades support `RollingUpdate`.
strategy:
  type: Recreate
# -- Grace period for in-flight messages to persist and ACK before SIGKILL.
terminationGracePeriodSeconds: 30

preStopDelaySeconds: 5

# -- Pod resources. The boot-time workspace build is memory-hungry: set a generous memory limit or none.
resources: {}

verticalPodAutoscaler:
  enabled: false
  controlledResources: []
  controlledValues: ""
  maxAllowed: {}
  minAllowed: {}
  updatePolicy:
    updateMode: Initial
    # -- Lets the updater act on the single pod; by default it skips workloads with fewer than 2 replicas. `null` keeps that default.
    minReplicas: 1

# -- Node selector for scheduling.
nodeSelector: {}
# -- Affinity rules for scheduling.
affinity: {}
# -- Tolerations for scheduling.
tolerations: []
# -- Pod priority class, so the scheduler doesn't preempt the single pod for less important work.
priorityClassName: ""

# -- Don't mount the ServiceAccount token; interbox never calls the Kubernetes API.
automountServiceAccountToken: false

# -- Container securityContext. The image runs as non-root `bun` (uid 1000) and writes to HOME and `/tmp`.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# -- Pod annotations.
podAnnotations: {}
# -- Deployment annotations.
deploymentAnnotations: {}
# -- Extra pod volumes.
volumes: []
# -- Extra container volume mounts.
volumeMounts: []

workspaceCache:
  # -- Mount a pod-local `emptyDir` at the workspace cache path. The checkout, dependencies and bundles then survive a container restart and go away with the pod. `false` keeps the cache in the container filesystem, or leaves the path to a volume of your own.
  enabled: true
  # -- Where to mount it. Keep it equal to `INTERBOX_WORKSPACE_CACHE` when `config` sets one; the engine's default is `/tmp/interbox-engine`.
  mountPath: /tmp/interbox-engine
  # -- `emptyDir.sizeLimit`, such as `10Gi`. Kubernetes evicts a pod whose cache outgrows it. Empty = no limit.
  sizeLimit: ""

serviceAccount:
  # -- Create a ServiceAccount for the pod.
  create: false
  # -- ServiceAccount name (default: the fullname when `create` is true).
  name: ""
  # -- ServiceAccount annotations.
  annotations: {}

# -- Non-secret env → ConfigMap (envFrom). Keys are env var names. `INTERBOX_WORKSPACE_GIT_URL` and
# `INTERBOX_PUBLIC_URL` are required. `MLLP_HOST` and `MLLP_PORT` feed the workspace's MLLP source.
config:
  INTERBOX_WORKSPACE_POLL_MS: "5000"

  MLLP_HOST: "0.0.0.0"
  MLLP_PORT: "2575"

  AIDBOX_URL: "http://aidbox:8080"

# -- Secret env → Secret (envFrom). Keys are env var names; empty ones are skipped. `DATABASE_URL`
# is required. The dashboard also needs `INTERBOX_AUTH_ADMIN_PASSWORD` unless
# `INTERBOX_AUTH_ADMIN_ENABLED` is `false` (OIDC only; see PREREQUISITES.md).
# `secrets.data.<KEY>` is deprecated; a flat key wins.
secrets:
  # -- Pre-provisioned Secret to use instead of rendering one (External Secrets Operator, sealed-secrets, …).
  existingSecretName: ""

  DATABASE_URL: ""
  INTERBOX_DB_DATABRICKS_CLIENT_SECRET: ""

  INTERBOX_AUTH_ADMIN_PASSWORD: ""
  INTERBOX_AUTH_CLIENT_SECRET: ""

  INTERBOX_WORKSPACE_GIT_KEY: ""
  INTERBOX_LICENSE: ""

  AIDBOX_CLIENT_SECRET: ""

  CLAUDE_CODE_OAUTH_TOKEN: ""
  ANTHROPIC_API_KEY: ""

# -- Extra ConfigMaps to load env from (envFrom).
extraEnvFromConfigMaps: []
# -- Extra Secrets to load env from (envFrom).
extraEnvFromSecrets: []

database:
  # -- The engine creates the `interbox` db on boot (`DATABASE_URL` user needs `CREATEDB`). `false` sets `INTERBOX_SKIP_ENSURE_DB`: pre-create the db yourself.
  createDatabase: true

service:
  # -- Dashboard/API Service type.
  type: ClusterIP
  # -- Dashboard/API port.
  port: 3001
  # -- Dashboard/API Service annotations.
  annotations: {}

mllp:
  # -- Expose MLLP (HL7v2 over raw TCP).
  enabled: true
  # -- MLLP TCP port. Match the port the workspace's MLLP source listens on.
  port: 2575
  service:
    # -- MLLP Service type. Raw TCP, so not an Ingress.
    type: LoadBalancer
    # -- MLLP Service annotations. Without the cloud's internal-LB annotation (see values-aks.yaml), most clouds give the LoadBalancer a public IP.
    annotations: {}
    # -- `Local` keeps the sender's source IP. Empty = `Cluster`.
    externalTrafficPolicy: Local
    # -- Static LB IP, a stable VPN/firewall target. Empty = dynamic. Kubernetes deprecated the field; prefer a cloud annotation.
    loadBalancerIP: ""
    # -- Sender CIDRs allowed to reach the LB.
    loadBalancerSourceRanges: []

ingress:
  # -- Dashboard/API Ingress. Use an internal ingress class only; never expose it publicly.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress host.
  host: interbox.example.com
  # -- Ingress path. AWS ALB and GKE gce want `/*` with `pathType: ImplementationSpecific`.
  path: /
  # -- Ingress pathType (Prefix | ImplementationSpecific | Exact).
  pathType: Prefix
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress TLS blocks.
  tls: []

route:
  main:
    enabled: false
    parentRefs: []
    hostnames: []
    annotations: {}
    labels: {}
    matches:
      - path:
          type: PathPrefix
          value: /
    filters: []
    timeouts: {}
    additionalRules: []
    httpsRedirect: false

networkPolicy:
  # -- Render an ingress-only NetworkPolicy for the pod. Egress stays open.
  enabled: false
  # -- NetworkPolicyPeers allowed to reach the dashboard/API port. Empty = none; `kubectl port-forward` still works.
  dashboardFrom: []
  # -- NetworkPolicyPeers allowed to reach the MLLP port. Empty = any source.
  mllpFrom: []
