name: Interbox chart tests
on:
  pull_request:
    paths: ['interbox/**', '.github/workflows/interbox-test.yaml']
  push:
    branches: [main]
    paths: ['interbox/**', '.github/workflows/interbox-test.yaml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633
      - name: Install Helm unittest
        run: |
          curl --fail --location --remote-name https://github.com/helm-unittest/helm-unittest/releases/download/v1.2.1/helm-unittest-linux-amd64-1.2.1.tgz
          curl --fail --location --remote-name https://github.com/helm-unittest/helm-unittest/releases/download/v1.2.1/helm-unittest-checksum.sha
          sha256sum --ignore-missing --check helm-unittest-checksum.sha
          mkdir -p /tmp/helm-unittest
          tar -xzf helm-unittest-linux-amd64-1.2.1.tgz -C /tmp/helm-unittest
      - name: Lint and test Interbox
        run: |
          helm lint interbox
          /tmp/helm-unittest/untt-linux-amd64 interbox
