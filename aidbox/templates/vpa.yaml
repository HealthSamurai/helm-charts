{{- if .Values.verticalPodAutoscaler.enabled }}
{{- $vpa := .Values.verticalPodAutoscaler }}
{{- $updatePolicy := $vpa.updatePolicy | default dict }}
{{- if or (not (kindIs "string" $updatePolicy.updateMode)) (empty $updatePolicy.updateMode) }}
{{- fail "verticalPodAutoscaler.updatePolicy.updateMode is required: Off | Initial | Recreate | InPlaceOrRecreate (quote \"Off\" — bare Off is YAML false)" }}
{{- end }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "aidbox.fullname" . }}
  labels:
    {{- include "aidbox.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "aidbox.fullname" . }}
  updatePolicy:
    updateMode: {{ $updatePolicy.updateMode | quote }}
    {{- if not (kindIs "invalid" $updatePolicy.minReplicas) }}
    minReplicas: {{ $updatePolicy.minReplicas }}
    {{- end }}
  {{- if or $vpa.controlledResources $vpa.controlledValues $vpa.minAllowed $vpa.maxAllowed }}
  resourcePolicy:
    containerPolicies:
      - containerName: {{ .Chart.Name }}
        {{- with $vpa.controlledResources }}
        controlledResources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $vpa.controlledValues }}
        controlledValues: {{ . | quote }}
        {{- end }}
        {{- with $vpa.minAllowed }}
        minAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $vpa.maxAllowed }}
        maxAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
  {{- end }}
{{- end }}
