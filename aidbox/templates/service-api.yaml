apiVersion: v1
kind: Service
metadata:
  name: {{ include "aidbox.fullname" . }}-api
  labels:
    {{- include "aidbox.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: api
      port: {{ int .Values.service.apiPort }}
      protocol: TCP
      targetPort: api
  selector:
    {{- include "aidbox.selectorLabels" . | nindent 4 }}
