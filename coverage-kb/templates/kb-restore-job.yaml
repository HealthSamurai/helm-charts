{{- if .Values.kbRestore.enabled }}
{{- $kb := .Values.kbRestore }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "coverage-kb.fullname" . }}-kb-restore
  labels:
    {{- include "coverage-kb.labels" . | nindent 4 }}
  annotations:
    {{- /* A hook, so every install/upgrade gets a fresh Job instead of patching an immutable one. */}}
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ $kb.backoffLimit }}
  ttlSecondsAfterFinished: {{ $kb.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "coverage-kb.selectorLabels" . | nindent 8 }}
        job: kb-restore
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "coverage-kb.serviceAccountName" . }}
      serviceAccountName: {{ include "coverage-kb.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: restore
          image: {{ $kb.image }}
          env:
            - name: MCD_DUMP_URL
              value: {{ $kb.dumpUrl | quote }}
            {{- with $kb.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $kb.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - |
              set -e
              db="${DATABASE_PG_URL:-$PGDATABASE}"
              if psql -d "$db" -tAc "select to_regclass('mcd.lcd_x_hcpc_code')" | grep -q .; then
                echo "[kb] already loaded"; exit 0
              fi
              echo "[kb] downloading $MCD_DUMP_URL"
              wget -q -O /tmp/mcd.dump "$MCD_DUMP_URL"
              # The dump carries ParadeDB BM25 indexes; a stock Postgres skips them (KB search
              # falls back to LIKE, decisions read plain tables). Verify the data, not the exit code.
              pg_restore --no-owner --no-privileges -d "$db" /tmp/mcd.dump || true
              rows=$(psql -d "$db" -tAc "select count(*) from mcd.lcd_x_hcpc_code")
              [ "$rows" -gt 0 ] || { echo "[kb] restore failed: no hcpc rows"; exit 1; }
              echo "[kb] restored: $rows hcpc rows"
          {{- with $kb.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with $kb.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
