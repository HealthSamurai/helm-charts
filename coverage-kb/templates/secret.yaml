{{- if not .Values.secrets.existingSecretName }}
{{- if not .Values.secrets.DATABASE_PG_URL }}
{{- fail "secrets.DATABASE_PG_URL is required (or set secrets.existingSecretName)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coverage-kb.secretName" . }}
  labels:
    {{- include "coverage-kb.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if and (ne $key "existingSecretName") $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
