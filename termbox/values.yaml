# termbox — FHIR Terminology Server (CodeSystem/ValueSet/ConceptMap + standard
# FHIR terminology operations: $lookup, $validate-code, $expand, $translate, ...).
#
# Standalone chart: deploys termbox only. Postgres is NOT bundled — point termbox at
# an existing database via config/secrets. Need one in-cluster? Install the sibling
# `postgres` chart (see PREREQUISITES.md) and set config.PG_HOST / secrets.data.PG_PASSWORD.

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource name (default: the chart name — keeps the in-cluster service name stable).
fullnameOverride: ""

# -- Pod replicas.
replicaCount: 1

image:
  # -- Image repository.
  repository: healthsamurai/termbox
  # -- Image tag; defaults to `.Chart.AppVersion` (`latest`). Pin a released tag for reproducible prod.
  tag: ""
  # -- Pin by digest (wins over tag when set).
  digest: ""
  # -- Image pull policy. `Always` refreshes the moving `latest` tag; set `IfNotPresent` once pinned.
  pullPolicy: Always

# -- Image pull secrets for a private registry.
imagePullSecrets: []

# HTTP probes against the FHIR API — requires a valid LICENSE (secrets.data.LICENSE)
probe:
  # -- HTTP health path.
  path: /fhir/metadata
  # -- Probe scheme (HTTP / HTTPS).
  scheme: HTTP
  # -- Startup probe. Generous: covers boot-time DB migrations.
  startup:
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 30
  # -- Liveness probe.
  liveness:
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  # -- Readiness probe.
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# -- Deployment strategy.
strategy:
  type: RollingUpdate
# -- Grace period for in-flight requests to finish before SIGKILL.
terminationGracePeriodSeconds: 30

# -- Pod resource requests / limits. e.g. requests: {cpu: 100m, memory: 512Mi}.
resources: {}

# -- Node selector for scheduling.
nodeSelector: {}
# -- Affinity rules for scheduling.
affinity: {}
# -- Tolerations for scheduling.
tolerations: []
# -- Don't mount the ServiceAccount token — termbox never calls the Kubernetes API.
automountServiceAccountToken: false

# -- Container securityContext. Hardened for prod.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
# -- Extra pod annotations.
podAnnotations: {}

serviceAccount:
  # -- Create a ServiceAccount for the pod.
  create: false
  # -- ServiceAccount name (generated from the fullname if empty and create=true).
  name: ""
  # -- ServiceAccount annotations.
  annotations: {}

# -- Non-secret env → ConfigMap (envFrom). Keys ARE env var names — see
# https://www.health-samurai.io/docs/termbox/configuration for the full list
# (logging, feature toggles, FHIR API version routes, etc.).
config:
  PG_HOST: postgres
  PG_PORT: "5432"
  PG_DATABASE: termbox
  PG_USER: postgres
  LOG_MIN_LEVEL: INFO
  LOG_FORMAT: text

secrets:
  # -- Use a pre-provisioned Secret instead of creating one from `data` below (External Secrets Operator, sealed-secrets, …).
  existingSecretName: ""
  # -- Secret env → Secret (envFrom). Keys ARE env var names; only non-empty ones are written.
  # `PG_PASSWORD` and `LICENSE` are both required — the chart's probes httpGet the FHIR
  # API, which returns 403 without a valid license, so the pod never becomes Ready
  # without one. See https://www.health-samurai.io/docs/termbox/licensing.
  data:
    PG_PASSWORD: ""
    LICENSE: ""

# -- Extra ConfigMaps to load env from (envFrom) — extend the pod's env without editing the chart.
extraEnvFromConfigMaps: []
# -- Extra Secrets to load env from (envFrom).
extraEnvFromSecrets: []

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port and the container's HTTP_PORT (kept in sync — see templates/deployment.yaml).
  port: 3000

ingress:
  # -- Ingress for the API/UI.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress host.
  host: termbox.example.com
  # -- Ingress path. Default `/` (works nginx / AGIC / modern ALB). AWS ALB + GKE gce
  # prefer `/*` — pair it with pathType: ImplementationSpecific.
  path: /
  # -- Ingress pathType (Prefix | ImplementationSpecific | Exact).
  pathType: Prefix
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress TLS blocks.
  tls: []
