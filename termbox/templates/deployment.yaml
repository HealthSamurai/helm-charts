apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "termbox.fullname" . }}
  labels:
    {{- include "termbox.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "termbox.selectorLabels" . | nindent 6 }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "termbox.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "termbox.serviceAccountName" . }}
      serviceAccountName: {{ include "termbox.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "termbox.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # Single source of truth for the listen port — kept in sync with the
            # Service/containerPort via .Values.service.port instead of duplicating
            # it in .Values.config.
            - name: HTTP_PORT
              value: {{ .Values.service.port | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "termbox.fullname" . }}-config
            - secretRef:
                name: {{ include "termbox.secretName" . }}
            {{- range .Values.extraEnvFromConfigMaps }}
            - configMapRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- $probe := .Values.probe }}
          {{- with $probe.startup }}
          startupProbe:
            httpGet:
              path: {{ $probe.path }}
              port: http
              scheme: {{ $probe.scheme | default "HTTP" }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $probe.liveness }}
          livenessProbe:
            httpGet:
              path: {{ $probe.path }}
              port: http
              scheme: {{ $probe.scheme | default "HTTP" }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $probe.readiness }}
          readinessProbe:
            httpGet:
              path: {{ $probe.path }}
              port: http
              scheme: {{ $probe.scheme | default "HTTP" }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      restartPolicy: Always
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
